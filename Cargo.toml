[package]
name = "charmander"
version = "0.2.0"
edition = "2024"
description = "A hotkey-driven Unicode character picker with favorites and Windows-style Alt codes"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Varelion/charmander"
readme = "README.md"
keywords = ["unicode", "emoji", "picker", "hotkey", "character"]
categories = ["command-line-utilities"]

[dependencies]
eframe = "0.37.0"
egui = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", features = ["xtest"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
enigo = "0.6.1"

[target.'cfg(windows)'.dependencies]
mslnk = "0.1.8"
